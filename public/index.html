<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextendo Network Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 10px; }
        
        #new-game-banner {
            display: none;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: #ffffff;
            text-align: center;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 0 auto 25px auto;
            max-width: 1200px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #new-game-banner span.badge {
            background-color: #ef4444;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        #status-container {
            display: flex; justify-content: center; align-items: center; min-height: 50vh;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        .game-card {
            background-color: #1e1e1e; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .game-cover { width: 100%; height: 200px; object-fit: cover; background-color: #2a2a2a; }
        .game-info { padding: 15px; }
        .game-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #ffffff; }
        .online-count { font-size: 1.3rem; font-weight: bold; color: #4ade80; }
        .error-message { color: #ef4444; text-align: center; }
    </style>
</head>
<body>

    <h1>Nextendo Online Status</h1>
    
    <div id="new-game-banner">
        <span class="badge">NEW</span> <span id="new-game-text"></span>
    </div>

    <div id="status-container">
        <p id="loading">Fetching network status from Vercel edge cache...</p>
    </div>

    <script>
        async function fetchStatus() {
            const container = document.getElementById('status-container');
            
            try {
                const response = await fetch('/api/games-status');
                if (!response.ok) throw new Error("Failed to communicate with Vercel function");

                const data = await response.json();
                if (!data.success) throw new Error("API returned an error state");

                // Handle New Game Banner display
                if (data.newestGame) {
                    const banner = document.getElementById('new-game-banner');
                    document.getElementById('new-game-text').textContent = `New game added to the Nextendo Network: ${data.newestGame}!`;
                    banner.style.display = 'block';
                }

                container.innerHTML = '<div class="grid" id="game-grid"></div>';
                const grid = document.getElementById('game-grid');

                data.games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    const img = document.createElement('img');
                    img.className = 'game-cover';
                    img.src = game.icon;
                    img.alt = game.name;
                    img.onerror = () => { 
                        img.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="256" height="256" background="%232a2a2a"%3E%3Ctext x="50%25" y="50%25" fill="%23fff" text-anchor="middle" alignment-baseline="middle"%3ENo Image%3C/text%3E%3C/svg%3E'; 
                    };

                    const info = document.createElement('div');
                    info.className = 'game-info';
                    info.innerHTML = `
                        <div class="game-title">${game.name}</div>
                        <div style="font-size: 0.75rem; color: #888; margin-bottom: 10px;">ID: ${game.id}</div>
                        <div class="online-count">🟢 ${game.players} Online</div>
                    `;

                    card.appendChild(img);
                    card.appendChild(info);
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Unable to load status</h2>
                        <p>There was an error connecting to the backend service.</p>
                    </div>
                `;
            }
        }

        fetchStatus();
    </script>
</body>
</html>
