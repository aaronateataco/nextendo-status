<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextendo Network Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        #status-container {
            display: flex; justify-content: center; align-items: center; min-height: 50vh;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        .game-card {
            background-color: #1e1e1e; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center;
            transition: transform 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .game-card:hover { transform: translateY(-5px); }
        .game-cover { width: 100%; height: 200px; object-fit: cover; background-color: #2a2a2a; }
        .game-info { padding: 15px; }
        .game-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #ffffff; }
        .online-count { font-size: 1.3rem; font-weight: bold; color: #4ade80; }
        .error-message { color: #ef4444; text-align: center; }
    </style>
</head>
<body>

    <h1>Nextendo Online Status</h1>
    <div id="status-container">
        <p id="loading">Fetching online counts...</p>
    </div>

    <script>
        const API_URL = "/api/status";
        const DEFAULT_FALLBACK_SVG = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="256" height="256" background="%232a2a2a"%3E%3Ctext x="50%25" y="50%25" fill="%23fff" text-anchor="middle" alignment-baseline="middle"%3ENo Image%3C/text%3E%3C/svg%3E';

        const GAMES = [
            { name: "Mario Kart 8 Deluxe", ids: ["0100152000022000"] },
            { name: "Splatoon 2", ids: ["0100f8f0000a2000", "01003bc0000a0000", "01003c700009c800"] },
            { name: "Splatoon 3", ids: ["0100c2500fc20000"] },
            { name: "Super Smash Bros. Ultimate", ids: ["01006a800016e000"] },
            { name: "Animal Crossing: New Horizons", ids: ["01006f8002326000"] },
            { name: "Luigi's Mansion 3", ids: ["0100dca0064a6000"] },
            { name: "Minecraft: Nintendo Switch Edition", ids: ["01006bd001e06000"] },
            { name: "ARMS", ids: ["01009b500007c000"] },
            { name: "Mario Tennis Aces", ids: ["0100bde00862a000"] },
            { name: "Super Mario Maker 2", ids: ["01009b90006dc000"] },
            { name: "PAC-MAN 99", ids: ["0100ad9012510000"] },
            { name: "SUPER MARIO BROS. 35", ids: ["0100277011f1a000"] }
        ];

        // Cache icon URLs locally so we don't spam search requests
        function getCachedIcon(gameName) {
            try {
                const cache = JSON.parse(localStorage.getItem('switch_icon_cache') || '{}');
                return cache[gameName] || null;
            } catch (e) { return null; }
        }

        function setCachedIcon(gameName, url) {
            try {
                const cache = JSON.parse(localStorage.getItem('switch_icon_cache') || '{}');
                cache[gameName] = url;
                localStorage.setItem('switch_icon_cache', JSON.stringify(cache));
            } catch (e) {}
        }

        // Scrape search results from SwitchIconShowdown for the game icon
        async function fetchGameIconUrl(gameName) {
            const cached = getCachedIcon(gameName);
            if (cached) return cached;

            try {
                const searchTarget = `https://www.switchiconshowdown.com/search.php?query=${encodeURIComponent(gameName)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(searchTarget)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) return null;
                
                const payload = await response.json();
                if (!payload.contents) return null;

                const parser = new DOMParser();
                const doc = parser.parseFromString(payload.contents, 'text/html');
                const rows = doc.querySelectorAll('table tr');

                for (const row of rows) {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 2) {
                        const titleText = cells[1].textContent.trim().toLowerCase();
                        const targetText = gameName.toLowerCase();

                        // Match exact title or close containment match
                        if (titleText === targetText || titleText.includes(targetText) || targetText.includes(titleText)) {
                            const img = cells[0].querySelector('img');
                            if (img) {
                                const src = img.getAttribute('src'); // e.g. "./images/100/4582.png"
                                const match = src.match(/(\d+)\.png/);
                                if (match && match[1]) {
                                    const fullResUrl = `https://switchiconshowdown.com/images/${match[1]}.png`;
                                    setCachedIcon(gameName, fullResUrl);
                                    return fullResUrl;
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(`Error scraping icon for ${gameName}:`, err);
            }
            return null;
        }

        function lookupGame(titleId) {
            const cleanId = titleId.toLowerCase();
            for (const game of GAMES) {
                if (game.ids.some(id => id.toLowerCase() === cleanId)) {
                    return { name: game.name, id: game.ids[0].toUpperCase() };
                }
            }
            return { name: `Unknown Game (${titleId.toUpperCase()})`, id: titleId.toUpperCase() };
        }

        async function fetchStatus() {
            const container = document.getElementById('status-container');
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Backend failed to load data");

                const data = await response.json();
                
                container.innerHTML = '<div class="grid" id="game-grid"></div>';
                const grid = document.getElementById('game-grid');

                if (data.counts) {
                    const gameDataMap = new Map();

                    Object.entries(data.counts).forEach(([titleIdRaw, count]) => {
                        const { name, id } = lookupGame(titleIdRaw);
                        if (!gameDataMap.has(name)) {
                            gameDataMap.set(name, { name, mainId: id, totalCount: 0 });
                        }
                        gameDataMap.get(name).totalCount += Number(count) || 0;
                    });

                    gameDataMap.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';

                        const img = document.createElement('img');
                        img.className = 'game-cover';
                        img.src = DEFAULT_FALLBACK_SVG; // Placeholder while scraping
                        img.alt = game.name;

                        // Async fetch icon from SwitchIconShowdown
                        fetchGameIconUrl(game.name).then(iconUrl => {
                            if (iconUrl) {
                                img.src = iconUrl;
                            } else {
                                // Fallback to tinfoil.media if not found on SwitchIconShowdown
                                img.src = `https://tinfoil.media/ti/${game.mainId}/256/256/`;
                            }
                        });

                        img.onerror = () => { img.src = DEFAULT_FALLBACK_SVG; };

                        const info = document.createElement('div');
                        info.className = 'game-info';
                        info.innerHTML = `
                            <div class="game-title">${game.name}</div>
                            <div style="font-size: 0.75rem; color: #888; margin-bottom: 10px;">ID: ${game.mainId}</div>
                            <div class="online-count">🟢 ${game.totalCount} Online</div>
                        `;

                        card.appendChild(img);
                        card.appendChild(info);
                        grid.appendChild(card);
                    });

                } else {
                    throw new Error("Unexpected API response format");
                }

            } catch (error) {
                console.error("Failed to fetch status:", error);
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Unable to load status</h2>
                        <p>There was an error connecting to the API.</p>
                    </div>
                `;
            }
        }

        fetchStatus();
    </script>
</body>
</html>
