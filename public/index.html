<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextendo Network Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        #status-container {
            display: flex; justify-content: center; align-items: center; min-height: 50vh;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        .game-card {
            background-color: #1e1e1e; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center;
            transition: transform 0.2s;
        }
        .game-card:hover { transform: translateY(-5px); }
        .game-cover { width: 100%; height: 200px; object-fit: cover; background-color: #2a2a2a; }
        .game-info { padding: 15px; }
        .online-count { font-size: 1.5rem; font-weight: bold; color: #4ade80; }
        .error-message { color: #ef4444; text-align: center; }
    </style>
</head>
<body>

    <h1>Nextendo Online Status</h1>
    <div id="status-container">
        <p id="loading">Fetching online counts...</p>
    </div>

    <script>
        const API_URL = "/api/status";
        const IMAGE_BASE_URL = "https://tinfoil.media/ti";
        const IMAGE_SIZE = "256/256"; 

        // Title ID converted to uppercase for cover images
        function getCoverUrl(titleId) {
            return `${IMAGE_BASE_URL}/${titleId.toUpperCase()}/${IMAGE_SIZE}/`;
        }

        async function fetchStatus() {
            const container = document.getElementById('status-container');
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Backend failed to load data");

                const data = await response.json();
                
                container.innerHTML = '<div class="grid" id="game-grid"></div>';
                const grid = document.getElementById('game-grid');

                if (data.counts) {
                    Object.entries(data.counts).forEach(([titleIdRaw, onlineCount]) => {
                        const titleId = titleIdRaw.toUpperCase();

                        const card = document.createElement('div');
                        card.className = 'game-card';

                        const img = document.createElement('img');
                        img.className = 'game-cover';
                        img.src = getCoverUrl(titleId);
                        img.alt = `Game ${titleId}`;
                        img.onerror = () => { img.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="256" height="256" background="%232a2a2a"%3E%3Ctext x="50%25" y="50%25" fill="%23fff" text-anchor="middle" alignment-baseline="middle"%3ENo Image%3C/text%3E%3C/svg%3E'; };

                        const info = document.createElement('div');
                        info.className = 'game-info';
                        info.innerHTML = `
                            <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">ID: ${titleId}</div>
                            <div class="online-count">🟢 ${onlineCount} Online</div>
                        `;

                        card.appendChild(img);
                        card.appendChild(info);
                        grid.appendChild(card);
                    });
                } else {
                    throw new Error("Unexpected API response format");
                }

            } catch (error) {
                console.error("Failed to fetch status:", error);
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Unable to load status</h2>
                        <p>There was an error connecting to the API.</p>
                    </div>
                `;
            }
        }

        fetchStatus();
    </script>
</body>
</html>
